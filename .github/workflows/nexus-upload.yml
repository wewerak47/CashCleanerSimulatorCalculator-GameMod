name: Upload to NexusMods

# Runs on every push to main that touches the mod, or manually from the
# Actions tab. Version is auto-generated from the run number, so there's
# nothing to bump by hand.
on:
  push:
    branches: [main]
    paths:
      - 'CCS_ScanExport/**'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Zip mod
        run: zip -r CCS_ScanExport.zip CCS_ScanExport

      - name: Upload to NexusMods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          filename: CCS_ScanExport.zip
          version: 1.0.${{ github.run_number }}
          category: main
          archive_existing_version: true
